services:
  hr-portal:
    build: .
    image: banknxt-ot-wfh:latest
    container_name: banknxt-hr-portal
    ports:
      - "80:8080"
    volumes:
      # Use a volume for persistence without host-file permission issues
      - db-data:/app/backend/data
    environment:
      - DB_PATH=/app/backend/data/dashboard.db
    restart: always

volumes:
  db-data:
